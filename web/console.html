<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>控制台 · LLM Gateway</title>
<style>
/* ══════════════════════════════════════════════════════
   扁平化设计
   · 无渐变、无模糊、极少阴影
   · 小圆角 3px，1px 边框分隔层次
   · 单一强调色 #2563eb
   ══════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* New API 风格色板：柔和灰底、白面板、亮蓝强调 */
  --bg:#f0f2f5; --panel:#ffffff; --panel2:#f5f7fa;
  --line:#e8ecf1; --line2:#d9dee5;
  --text:#1a1f2e; --muted:#5f6b7a; --dim:#9aa5b1;
  --accent:#3b82f6; --accent-deep:#2563eb; --ok:#10b981; --warn:#f59e0b; --err:#ef4444;
  --violet:#8b5cf6; --cyan:#06b6d4; --rose:#f43f5e; --amber:#f59e0b;
  --radius:10px; --radius-sm:6px;
  --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 12px 32px -8px rgba(16,24,40,.16),0 4px 12px rgba(16,24,40,.05);
}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.hide{display:none!important}

.btn{padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
  border:1px solid var(--line2);background:var(--panel);color:var(--text);
  cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;
  box-shadow:var(--shadow)}
.btn:hover{background:var(--panel2);border-color:#c4ccd6}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-ok{border-color:rgba(16,185,129,.4);color:var(--ok);background:rgba(16,185,129,.06)}
.btn-ok:hover{background:rgba(16,185,129,.14)}
.btn-danger{border-color:rgba(239,68,68,.4);color:var(--err);background:rgba(239,68,68,.06)}
.btn-danger:hover{background:rgba(239,68,68,.14)}
.btn-ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--panel2);border-color:var(--line2);color:var(--text)}

input{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--line2);
  border-radius:3px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
input:focus{border-color:var(--accent)}
input:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}

#loginBox{max-width:340px;margin:16vh auto;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:32px 28px}
#loginBox h1{font-size:17px;font-weight:600;text-align:center;margin-bottom:26px;letter-spacing:.3px}
.field{margin-bottom:14px}
/* ── 在线试玩 ── */
.pg-lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.pg-inp{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:3px;
  padding:9px 11px;font-size:13.5px;color:var(--text);font-family:inherit;outline:none;resize:vertical;line-height:1.65}
.pg-inp:focus{border-color:var(--accent)}
.pg-reply{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;
  font-size:13.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;margin-top:12px}
.pg-meta{font-size:12px;color:var(--dim);margin-top:12px}
.btn-block{width:100%;padding:9px;margin-top:6px}
.msg{font-size:12.5px;text-align:center;margin-top:12px;min-height:18px}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.msg.warn{color:var(--warn)}

/* 普通用户壳：顶栏 + 单列 */
#userShell{display:none;min-height:100vh;flex-direction:column}
#userShell.show{display:flex}
.topbar{height:52px;border-bottom:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;padding:0 24px;gap:24px;flex:0 0 auto}
.brand{font-size:14px;font-weight:650;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.brand .logo{width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--violet) 100%);
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:11px;font-weight:800}
.topnav{display:flex;gap:2px;flex:1}
.topnav a{padding:6px 14px;border-radius:3px;font-size:13px;color:var(--muted);
  cursor:pointer;font-weight:500}
.topnav a:hover{background:var(--panel2);color:var(--text);text-decoration:none}
.topnav a.on{background:var(--panel2);color:var(--text)}
.topright{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.userMain{flex:1;overflow-y:auto;padding:28px 24px}
.userMain .inner{max-width:1120px;margin:0 auto}

/* 管理员壳：图标侧边栏（New API 风格） */
#adminShell{display:none;min-height:100vh}
#adminShell.show{display:flex}
.sidebar{width:224px;flex:0 0 224px;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.sidebrand{height:60px;display:flex;align-items:center;padding:0 20px;
  border-bottom:1px solid var(--line);font-size:15px;font-weight:700;letter-spacing:.3px;
  gap:10px}
.sidebrand .logo{width:28px;height:28px;border-radius:8px;flex:0 0 28px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--violet) 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.sidenav{flex:1;overflow-y:auto;padding:16px 12px}
.navgroup{margin-bottom:20px}
.navgroup .gtitle{font-size:10.5px;color:var(--dim);text-transform:uppercase;
  letter-spacing:1px;padding:0 10px 8px;font-weight:700}
.navgroup a{display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-radius:var(--radius-sm);font-size:13.5px;
  color:var(--muted);cursor:pointer;font-weight:500;margin-bottom:2px;
  transition:all .15s}
.navgroup a svg{width:17px;height:17px;flex:0 0 17px;opacity:.75;transition:opacity .15s}
.navgroup a:hover{background:var(--panel2);color:var(--text);text-decoration:none}
.navgroup a:hover svg{opacity:1}
.navgroup a.on{background:var(--accent);color:#fff;
  box-shadow:0 4px 12px -2px rgba(59,130,246,.4)}
.navgroup a.on svg{opacity:1}
.navgroup a .nvi{display:flex;align-items:center;gap:10px;flex:1}
.sidefoot{padding:14px 16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px}
.sidefoot .avatar{width:32px;height:32px;border-radius:50%;flex:0 0 32px;
  background:linear-gradient(135deg,var(--cyan),var(--accent));
  color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.sidefoot .who{font-size:12.5px;color:var(--text);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidefoot .who small{display:block;color:var(--dim);font-weight:400;font-size:10.5px}
.adminMain{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
.adminMain .inner{max-width:1180px;margin:0 auto}

/* 通用 */
.pagehead{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:24px;gap:16px;flex-wrap:wrap}
.pagehead h2{font-size:20px;font-weight:700;letter-spacing:-.2px}
.pagehead .desc{font-size:13px;color:var(--muted);margin-top:4px}

/* New API 风格统计卡：彩色圆底图标 + 大数字 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;
  margin-bottom:24px}
.card{background:var(--panel);padding:18px 20px;border-radius:var(--radius);
  border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:14px;transition:all .2s}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);
  border-color:#cdd6e2}
.card .ic{width:42px;height:42px;border-radius:10px;flex:0 0 42px;
  display:flex;align-items:center;justify-content:center}
.card .ic svg{width:20px;height:20px}
.card .ic.blue{background:rgba(59,130,246,.12);color:var(--accent)}
.card .ic.violet{background:rgba(139,92,246,.12);color:var(--violet)}
.card .ic.cyan{background:rgba(6,182,212,.12);color:var(--cyan)}
.card .ic.green{background:rgba(16,185,129,.12);color:var(--ok)}
.card .ic.amber{background:rgba(245,158,11,.14);color:var(--warn)}
.card .ic.rose{background:rgba(244,63,94,.12);color:var(--rose)}
.card .bd{flex:1;min-width:0}
.card .k{font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:500}
.card .v{font-size:23px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.card .v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.card .v.accent{color:var(--accent)}
.card .hint{font-size:11px;color:var(--dim);margin-top:3px}

table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);font-size:13px;
  overflow:hidden;box-shadow:var(--shadow)}
th{background:var(--panel2);text-align:left;padding:11px 14px;color:var(--muted);
  font-weight:600;font-size:11.5px;border-bottom:1px solid var(--line);
  white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:rgba(59,130,246,.045)}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12px}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;
  border-radius:999px;font-size:10.5px;
  font-weight:600;letter-spacing:.2px;border:1px solid transparent}
.tag::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.ok{color:#0d9d6d;border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)}
.tag.err{color:#e0364e;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
.tag.warn{color:#cf8a04;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.1)}
.tag.neutral{color:var(--muted);border-color:var(--line2);background:var(--panel2)}
.tag.blue{color:var(--accent-deep);border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.08)}

.section{margin-top:28px}
.section:first-child{margin-top:0}
.section h3{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;
  letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.section h3::before{content:'';width:3px;height:14px;border-radius:2px;
  background:var(--accent)}

.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:50px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));
  border-radius:3px;transition:width .3s}

.notice{border:1px solid var(--line);border-left:3px solid var(--warn);
  background:var(--panel);border-radius:var(--radius-sm);padding:12px 16px;
  font-size:13px;color:var(--muted);margin-bottom:20px;box-shadow:var(--shadow)}
.notice b{color:var(--text);font-weight:600}
.notice.info{border-left-color:var(--accent)}

.empty{padding:48px;text-align:center;color:var(--dim);background:var(--panel);
  border:1px dashed var(--line2);border-radius:var(--radius);font-size:13px}
.loading{padding:48px;text-align:center;color:var(--dim);font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;gap:12px;flex-wrap:wrap}
.toolbar input{max-width:220px;border-radius:var(--radius-sm)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  padding:10px 22px;background:#1a1f2e;border:1px solid rgba(255,255,255,.08);
  border-radius:999px;font-size:13px;color:#fff;z-index:999;
  box-shadow:0 8px 28px rgba(16,24,40,.3)}

/* SVG 图标基线 */
svg.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── 充值 ── */
.amtgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-bottom:16px}
.amt{padding:14px 8px;background:var(--panel2);border:1px solid var(--line2);
  border-radius:4px;color:var(--text);font-size:16px;font-weight:600;cursor:pointer;
  transition:border-color .15s,background .15s}
.amt:hover{border-color:var(--accent)}
.amt.on{border-color:var(--accent);background:var(--panel);color:var(--accent)}
.payrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.payrow input{flex:1;min-width:200px;max-width:320px}
.payrow select{min-width:120px}

@media(max-width:820px){
  .sidebar{width:60px;flex:0 0 60px}
  .sidebrand{justify-content:center;padding:0}
  .sidebrand span{display:none}
  .navgroup .gtitle{display:none}
  .navgroup a{justify-content:center;padding:10px 4px}
  .navgroup a .nvi span{display:none}
  .navgroup a svg{width:19px;height:19px}
  .sidefoot .who{display:none}
  .adminMain{padding:18px 14px}
  .userMain{padding:18px 14px}
  .topnav a{padding:6px 9px;font-size:12px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .card{padding:14px;gap:10px}
  .card .ic{width:34px;height:34px;flex:0 0 34px;border-radius:8px}
}
</style>
</head>
<body>

<div id="loginBox">
  <h1 id="loginTitle">LLM Gateway</h1>
  <div id="loginSub" style="text-align:center;color:var(--muted);font-size:13px;margin:-18px 0 22px"></div>
  <div class="field"><label>用户名</label>
    <input id="u" autocomplete="username" maxlength="64" autofocus></div>
  <div class="field"><label>密码</label>
    <input id="p" type="password" autocomplete="current-password" maxlength="200"></div>
  <div id="captchaWrap" class="field hide"><label>验证码</label>
    <div style="display:flex;gap:10px;align-items:center">
      <input id="cap" maxlength="6" placeholder="输入图中字符" style="flex:1" autocomplete="off">
      <img id="capImg" alt="验证码" title="看不清？点一下换一张"
           style="height:38px;width:116px;object-fit:cover;border-radius:5px;cursor:pointer;border:1px solid var(--line2);flex-shrink:0">
    </div>
  </div>
  <div id="loginExtra" class="hide" style="color:var(--dim);font-size:12px;line-height:1.6;margin-bottom:14px">
    用户名 3–32 位（中文/字母/数字/下划线），密码至少 8 位。<br>
    注册即解锁全部模型：免费模型不限次数，计费模型按次扣费，充值后即可使用。
  </div>
  <button class="btn btn-primary btn-block" id="loginBtn">登录</button>
  <div class="msg" id="msg"></div>
  <div style="text-align:center;margin-top:18px;font-size:13px;color:var(--muted)">
    <span id="switchHint">还没有账号？</span>
    <a href="#" id="switchBtn" style="font-weight:500">立即注册</a>
  </div>
</div>

<div id="userShell">
  <div class="topbar">
    <div class="brand"><span class="logo">L</span>LLM Gateway</div>
    <div class="topnav" id="userNav"></div>
    <div class="topright">
      <span id="userWho"></span>
      <button class="btn btn-sm btn-ghost" id="userLogout">退出</button>
    </div>
  </div>
  <div class="userMain"><div class="inner" id="userPane"><div class="loading">加载中…</div></div></div>
</div>

<div id="adminShell">
  <div class="sidebar">
    <div class="sidebrand"><div class="logo">L</div><span>LLM Gateway</span></div>
    <div class="sidenav" id="adminNav"></div>
    <div class="sidefoot">
      <div class="avatar" id="sideAva">A</div>
      <div class="who"><div id="sideMem"></div><small>管理员</small></div>
    </div>
  </div>
  <div class="adminMain"><div class="inner" id="adminPane"><div class="loading">加载中…</div></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => Number(n || 0).toLocaleString('zh-CN');
// 金额统一显示 8 位小数。
//
// ⚠️ 系统真实精度是 6 位：quota 为整数，1 元 = 1,000,000 quota，
// 所以最小可表示 0.000001 元。这里显示 8 位是为了让"余额还剩
// 0.001375 元"这种小额不会看起来像四舍五入成 0，末尾两位恒为 0。
// 以后若把换算改成 1 元 = 1e8，这里不用改。
const yuan = n => Number(n || 0).toFixed(8);
const fmtTime = t => t ? String(t).replace('T',' ').replace('Z','').slice(0,19) : '—';

// 耗时统一换算成秒，全站共用。
//
// 为什么不用毫秒：用户看到「5991ms」第一反应是"好慢"，看到「5.99 秒」
// 感受完全不同；而且小数值时毫秒反而不直观（0.31s 写成 310ms 会让人
// 以为慢了十倍）。小于 1 秒时保留两位，让 0.31 秒这种真实快照不被四舍五入。
const sec = ms => {
  const n = Number(ms) || 0;
  if (n <= 0) return '—';
  return (n / 1000).toFixed(2) + ' 秒';
};

let token = localStorage.getItem('ltzy_token') || '';
let me = null;

function toast(m) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = m;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {'Content-Type':'application/json','Authorization':'Bearer '+token, ...(opts.headers||{})},
  });
  if (res.status === 401) { logout(); throw new Error('登录已失效'); }
  return res.json();
}

function logout() {
  token = '';
  localStorage.removeItem('ltzy_token');
  $('#userShell').classList.remove('show');
  $('#adminShell').classList.remove('show');
  $('#loginBox').classList.remove('hide');
}

$('#loginBtn').onclick = () => authMode === 'register' ? doRegister() : doLogin();
$('#p').addEventListener('keydown', e => { if (e.key === 'Enter') (authMode === 'register' ? doRegister() : doLogin()); });
$('#u').addEventListener('keydown', e => { if (e.key === 'Enter') $('#p').focus(); });

// ── 登录 / 注册 模式切换 ──
let authMode = 'login';
let capId = '';

/** 取一张新验证码（服务端出图，服务端校验） */
async function loadCaptcha() {
  try {
    const r = await fetch('/api/captcha');
    const j = await r.json();
    if (j.success) {
      capId = j.data.id;
      $('#capImg').src = j.data.image;
      $('#cap').value = '';
    }
  } catch (e) {
    // 取图失败不阻断注册流程，提交时会由服务端判定
  }
}

function setAuthMode(mode) {
  authMode = mode;
  const isReg = mode === 'register';
  $('#loginTitle').textContent = isReg ? '注册账号' : 'LLM Gateway';
  $('#loginSub').textContent = isReg ? '输入用户名和密码，立即创建' : '';
  $('#loginBtn').textContent = isReg ? '注册并登录' : '登录';
  $('#switchHint').textContent = isReg ? '已有账号？' : '还没有账号？';
  $('#switchBtn').textContent = isReg ? '返回登录' : '立即注册';
  $('#p').setAttribute('autocomplete', isReg ? 'new-password' : 'current-password');
  $('#msg').textContent = '';
  $('#msg').className = 'msg';
  $('#loginExtra').classList.toggle('hide', !isReg);
  $('#captchaWrap').classList.toggle('hide', !isReg);
  if (isReg) loadCaptcha();
}

$('#capImg').onclick = loadCaptcha;

$('#switchBtn').onclick = (e) => {
  e.preventDefault();
  setAuthMode(authMode === 'register' ? 'login' : 'register');
};

async function doLogin() {
  const btn = $('#loginBtn'), msg = $('#msg');
  const u = $('#u').value.trim(), p = $('#p').value;
  msg.className = 'msg';
  if (!u) { msg.textContent = '请输入用户名'; msg.classList.add('err'); return; }
  if (!p) { msg.textContent = '请输入密码'; msg.classList.add('err'); return; }

  btn.disabled = true; btn.textContent = '登录中…'; msg.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p}),
    });
    const j = await res.json();
    if (j.success) {
      token = j.data.access_token;
      localStorage.setItem('ltzy_token', token);
      await boot();
      return;
    }
    if (res.status === 429) {
      msg.textContent = j.message || '尝试次数过多'; msg.classList.add('warn'); return;
    }
    // 登录失败时把提示与请求 ID 一起显示：
    // 用户报障时提供这个 ID，管理员在日志里能直接定位本次尝试
    // （日志已记录 user_exists，一眼看出是查无此人还是密码错误）。
    if (j.request_id) {
      msg.innerHTML = `${esc(j.message || '登录失败')}
        <div style="font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.6">
          ${esc(j.hint || '')}<br>请求 ID：<span class="mono">${esc(j.request_id)}</span>
        </div>`;
    } else {
      msg.textContent = j.message || '登录失败';
    }
    msg.classList.add('err');
    $('#p').value = '';
  } catch (e) {
    msg.textContent = '网络错误'; msg.classList.add('err');
  } finally {
    btn.disabled = false; btn.textContent = authMode === 'register' ? '注册并登录' : '登录';
  }
}

async function doRegister() {
  const btn = $('#loginBtn'), msg = $('#msg');
  const u = $('#u').value.trim(), p = $('#p').value, cap = $('#cap').value.trim();
  msg.className = 'msg';
  if (!u) { msg.textContent = '请输入用户名'; msg.classList.add('err'); return; }
  if (u.length < 3) { msg.textContent = '用户名至少 3 个字符'; msg.classList.add('err'); return; }
  if (!p) { msg.textContent = '请输入密码'; msg.classList.add('err'); return; }
  if (p.length < 8) { msg.textContent = '密码至少 8 位'; msg.classList.add('err'); return; }
  if (!cap) { msg.textContent = '请输入验证码'; msg.classList.add('err'); return; }

  btn.disabled = true; btn.textContent = '注册中…'; msg.textContent = '';
  try {
    const res = await fetch('/api/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p, captcha_id:capId, captcha_code:cap}),
    });
    const j = await res.json();
    if (j.success) {
      // 服务端注册即发放 token，直接进控制台，不用再登录一次
      token = j.data.access_token;
      localStorage.setItem('ltzy_token', token);
      toast('注册成功，已自动登录');
      await boot();
      return;
    }
    // 验证码是一次性的：失败后必须换一张再试
    if (j.code === 'bad_captcha') loadCaptcha();
    msg.textContent = j.message || '注册失败'; msg.classList.add('err');
  } catch (e) {
    msg.textContent = '网络错误'; msg.classList.add('err');
  } finally {
    btn.disabled = false; btn.textContent = authMode === 'register' ? '注册并登录' : '登录';
  }
}

async function boot() {
  // 品牌配置优先加载：即使未登录，登录页也要显示正确的站点名与 Logo
  loadSiteBrand();

  if (!token) { $('#loginBox').classList.remove('hide'); return; }
  try {
    const r = await fetch('/api/me', {headers:{'Authorization':'Bearer '+token}});
    if (!r.ok) { logout(); return; }
    const j = await r.json();
    if (!j.success) { logout(); return; }
    me = j.data;
    $('#loginBox').classList.add('hide');
    if (j.data.is_manager) buildAdmin();
    else buildUser();
  } catch (e) {
    logout();
  }
}

/* ══════════ 用户控制台 ══════════ */
function buildUser() {
  $('#userShell').classList.add('show');
  $('#userWho').textContent = me.user.display_name || me.user.username;

  // 代理与普通用户界面不同：
  //   代理拿货价由平台定，余额由平台划拨，**没有自助充值** ——
  //   所以不渲染"充值"菜单，避免给他一个点了就报错的入口。
  const isAgent = !!me.user.is_agent;

  const nav = $('#userNav');
  nav.innerHTML = isAgent
    ? `
    <a data-k="overview">概览</a>
    <a data-k="playground">在线试玩</a>
    <a data-k="models">我的模型</a>
    <a data-k="tokens">API 密钥</a>
    <a data-k="logs">调用日志</a>`
    : `
    <a data-k="overview">概览</a>
    <a data-k="playground">在线试玩</a>
    <a data-k="models">我的模型</a>
    <a data-k="tokens">API 密钥</a>
    <a data-k="recharge">充值</a>
    <a data-k="logs">调用日志</a>`;

  // 支持 ?tab=recharge 这类深链：支付完成后网关会把人送回
  // /console.html?tab=recharge，直接落在充值记录上，不用他自己找。
  const want = new URLSearchParams(location.search).get('tab');
  const valid = isAgent
    ? ['overview', 'playground', 'models', 'tokens', 'logs']
    : ['overview', 'playground', 'models', 'tokens', 'recharge', 'logs'];
  const initial = valid.includes(want) ? want : 'overview';

  nav.querySelectorAll('a').forEach(a => {
    a.onclick = () => {
      nav.querySelectorAll('a').forEach(x => x.classList.remove('on'));
      a.classList.add('on');
      renderUser(a.dataset.k);
    };
    if (a.dataset.k === initial) a.classList.add('on');
  });
  $('#userLogout').onclick = () => logout();
  renderUser(initial);
}

async function renderUser(key) {
  const pane = $('#userPane');
  pane.innerHTML = '<div class="loading">加载中…</div>';
  try {
    if (key === 'overview') await userOverview(pane);
    else if (key === 'playground') await userPlayground(pane);
    else if (key === 'models') await userModels(pane);
    else if (key === 'tokens') await userTokens(pane);
    else if (key === 'recharge') await userRecharge(pane);
    else if (key === 'logs') await userLogs(pane);
  } catch (e) {
    pane.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

// ── 在线试玩 ──
//
// 目的很直接：用户注册完，不用装任何客户端就能验证「这东西能不能用」。
// 之前模型广场的「试一下」跳 /?model=xxx，但首页根本没有测试区，
// 点了等于死链 —— 这个页面就是补那个洞。
//
// 直接打 /v1/chat/completions（不是 /api/*），因为要走真实的中继链路：
// 用户看到的结果就是真实计费、真实上游返回，不做任何模拟。
async function userPlayground(pane) {
  const r = await api('/api/account/models');
  const all = r.data.items || [];
  // 只留对话类：向量/重排/语音走别的端点，塞进这里选了必然报错
  const chat = all.filter(m => !m.category || m.category === 'chat' || m.category === 'vision');
  const free = chat.filter(m => m.tier === 'free');
  const paid = chat.filter(m => m.tier === 'paid');

  if (chat.length === 0) {
    pane.innerHTML = '<div class="empty">暂无可用于对话的模型</div>';
    return;
  }

  const opt = m => `<option value="${esc(m.model)}">${esc(m.model)}` +
    (m.tier === 'paid' ? `　¥${Number(m.price_yuan).toFixed(6)}/次` : '　免费') + '</option>';

  pane.innerHTML = `
    <div class="pagehead">
      <div><h2>在线试玩</h2>
        <div class="desc">不用装客户端，直接在这里验证。共 ${chat.length} 个对话模型</div></div>
    </div>
    <div class="field">
      <div class="pg-lbl">模型</div>
      <select id="pgModel" class="pg-inp">
        <optgroup label="免费模型 · 不扣余额">${free.map(opt).join('')}</optgroup>
        ${paid.length ? `<optgroup label="计费模型 · 按次扣费">${paid.map(opt).join('')}</optgroup>` : ''}
      </select>
    </div>
    <div class="field">
      <div class="pg-lbl">内容（Ctrl+Enter 发送）</div>
      <textarea id="pgPrompt" class="pg-inp" rows="5">你好，用一句话介绍你自己</textarea>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
      <button class="btn btn-primary" id="pgSend">发送</button>
      <button class="btn" id="pgClear">清空</button>
      <span class="pg-meta" id="pgTip"></span>
    </div>
    <div id="pgOut"></div>`;

  const out = pane.querySelector('#pgOut');
  const send = pane.querySelector('#pgSend');
  const tip = pane.querySelector('#pgTip');

  async function run() {
    const model = pane.querySelector('#pgModel').value;
    const text = pane.querySelector('#pgPrompt').value.trim();
    if (!text) { toast('内容不能为空'); return; }

    send.disabled = true;
    send.textContent = '生成中…';
    tip.textContent = '';
    out.innerHTML = '<div class="loading">等待上游响应…</div>';
    const t0 = performance.now();

    try {
      const res = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({
          model,
          messages: [{ role: 'user', content: text }],
          max_tokens: 1024,
        }),
      });
      const ms = Math.round(performance.now() - t0);
      const j = await res.json().catch(() => ({}));

      if (!res.ok) {
        const msg = j?.error?.message || j?.message || ('HTTP ' + res.status);
        const code = j?.error?.code || j?.code || '';
        out.innerHTML = `<div class="notice"><b>调用失败</b>（${esc(model)}，${sec(ms)}）<br>${esc(msg)}` +
          (code ? `　<span class="pg-meta">code=${esc(code)}</span>` : '') + '</div>';
      } else {
        const content = j?.choices?.[0]?.message?.content ?? '(空响应)';
        const usage = j?.usage || {};
        const tk = usage.total_tokens ? ` · ${usage.total_tokens} tokens` : '';
        out.innerHTML = `<div class="pg-reply">${esc(content)}</div>
          <div class="pg-meta">${esc(model)} · ${sec(ms)}${tk}</div>`;
      }
    } catch (e) {
      out.innerHTML = `<div class="notice"><b>请求失败</b><br>${esc(e.message)}</div>`;
    }

    send.disabled = false;
    send.textContent = '发送';
  }

  send.onclick = run;
  pane.querySelector('#pgClear').onclick = () => { out.innerHTML = ''; tip.textContent = ''; };
  pane.querySelector('#pgPrompt').onkeydown = e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  };
}

  // 他真正关心的不是"拿货价多少"，而是"我一单能赚多少"，

  const paidRow = m => isAgent ? `
    <tr><td class="mono">${esc(m.model)}</td><td>${esc(m.vendor)}</td>
      <td><b style="color:var(--accent)">¥${Number(m.price_yuan).toFixed(6)}</b></td>
      <td style="color:var(--muted)">¥${Number(m.retail_price_yuan || 0).toFixed(6)}</td>

      <td><span class="tag neutral">${((m.discount || 1) * 10).toFixed(1)} 折</span></td>
      <td><button class="btn btn-sm btn-ghost"
          onclick="copyText('${esc(m.model).replace(/'/g,"\\'")}')">复制 ID</button></td></tr>` : `
    <tr><td class="mono">${esc(m.model)}</td><td>${esc(m.vendor)}</td>
      <td><span class="tag warn">¥${Number(m.price_yuan).toFixed(6)} /次</span></td>
      <td><button class="btn btn-sm btn-ghost"
          onclick="copyText('${esc(m.model).replace(/'/g,"\\'")}')">复制 ID</button></td></tr>`;

    <tr><td class="mono">${esc(m.model)}</td><td>${esc(m.vendor)}</td>
      <td><span class="tag ok">免费</span></td>

    <table>

// ── 用户：充值 ──
//
// 支付走易支付：下单拿 payurl，用户在新窗口付，网关异步回调入账。
// 前端不做任何「假装已支付」的乐观更新 —— 余额只认服务端回调，
// 页面只是轮询/刷新看结果。
async function userRecharge(pane) {
  const [cfgRes, ordRes] = await Promise.all([
    fetch('/api/recharge/config').then(r => r.json()).catch(() => ({})),
    api('/api/recharge/orders').catch(() => ({ data: { items: [] } })),
  ]);
  const c = cfgRes.data || {};
  const list = (ordRes.data || {}).items || [];
  const amounts = c.amounts || [];

  pane.innerHTML = `
    <div class="pagehead">
      <div><h2>充值</h2>
        <div class="desc">${esc(c.unit_hint || '1 元 = 1,000,000 额度')}</div></div>
      <button class="btn btn-sm" onclick="renderUser('recharge')">刷新</button>
    </div>
    ${!c.enabled ? '<div class="notice warn">充值通道暂未开启，请联系管理员</div>' : `
    <div class="section">
      <h3>选择金额</h3>
      <div class="amtgrid" id="amtGrid">
        ${amounts.map(a => `<button class="amt" data-a="${a}">¥${a}</button>`).join('')}
      </div>
      <div class="payrow">
        <input id="customAmt" type="number" step="0.01" min="${c.min_amount || 0.01}" max="${c.max_amount || 5000}"
               placeholder="自定义金额（${c.min_amount || 0.01}~${c.max_amount || 5000} 元）">
        <select id="payType">
          ${(c.pay_types || ['alipay']).map(t =>
            `<option value="${esc(t)}">${t === 'alipay' ? '支付宝' : t === 'wxpay' ? '微信支付' : esc(t)}</option>`).join('')}
        </select>
        <button class="btn btn-primary" id="payBtn">去支付</button>
      </div>
      <div class="notice info" style="margin-top:14px">
        付款完成后额度会通过支付回调自动到账，通常 1 分钟内。若长时间未到账，
        请把订单号发给管理员核对。
      </div>
    </div>`}
    <div class="section">
      <h3>充值记录</h3>
      ${list.length === 0 ? '<div class="empty">暂无充值记录</div>' : `
      <table>
        <thead><tr><th>订单号</th><th>金额</th><th>到账额度</th><th>方式</th><th>状态</th><th>时间</th></tr></thead>
        <tbody>${list.map(o => `
          <tr><td class="mono" style="font-size:11.5px">${esc(o.order_no)}</td>
            <td>¥${Number(o.amount).toFixed(2)}</td>
            <td>${num(o.quota)}</td>
            <td>${o.pay_type === 'alipay' ? '支付宝' : o.pay_type === 'wxpay' ? '微信' : esc(o.pay_type || '—')}</td>
            <td>${o.status === 1 ? '<span class="tag ok">已到账</span>'
                 : o.status === 2 ? '<span class="tag">已关闭</span>'
                 : '<span class="tag warn">待支付</span>'}</td>
            <td class="mono" style="font-size:11.5px">${fmtTime(o.created_at)}</td></tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;

  // 金额单选
  let picked = 0;
  const amtBtns = pane.querySelectorAll('.amt');
  amtBtns.forEach(b => {
    b.onclick = () => {
      amtBtns.forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      picked = Number(b.dataset.a);
      const inp = $('#customAmt');
      if (inp) inp.value = '';
    };
  });

  const btn = $('#payBtn');
  if (!btn) return;

  btn.onclick = async () => {
    const custom = Number($('#customAmt')?.value || 0);
    const amount = custom > 0 ? custom : picked;
    if (amount <= 0) { toast('请先选择或输入充值金额'); return; }

    btn.disabled = true;
    btn.textContent = '下单中…';
    try {
      const r = await api('/api/recharge/create', {
        method: 'POST',
        body: JSON.stringify({ amount, pay_type: $('#payType').value }),
      });
      if (!r.success) { toast(r.message || '下单失败'); return; }
      const url = r.data && r.data.payurl;
      if (!url) { toast('支付网关未返回支付链接，请联系管理员'); return; }

      window.open(url, '_blank');

      setTimeout(() => renderUser('recharge'), 5000);

      toast('下单失败：' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '去支付';
    }

}

/* ── 用户：API 密钥 ──
 *
 * 后端三个接口一直都在（GET/POST/DELETE /api/token），但以前前端没有入口，
 * 用户拿不到自己的 key —— 只能用我们手工在库里建的。这里补上界面。
 *
 * 两个必须守住的点：
 *   1. 明文 key 只在「创建成功」那一刻出现一次，列表永远只给脱敏值
 *   2. 删除要二次确认，因为线上正在跑的程序会立刻断掉
 */

async function userTokens(pane) {
  const r = await api('/api/token');
  const items = Array.isArray(r.data) ? r.data : [];

  pane.innerHTML = `
    <div class="pagehead">
      <div><h2>API 密钥</h2>
        <div class="desc">调用时放在 <span class="mono">Authorization: Bearer sk-…</span> · 共 ${items.length} 个</div></div>
      <button class="btn btn-sm" id="tokNew">+ 新建密钥</button>
    </div>
    <div id="tokFlash"></div>
    ${items.length === 0
      ? '<div class="empty">还没有密钥，点右上角「新建密钥」</div>'
      : `<table>
          <thead><tr>
            <th>名称</th><th>密钥</th><th>专属额度</th><th>已用</th><th>创建时间</th><th></th>
          </tr></thead>
          <tbody>${items.map(t => `<tr>
            <td>${esc(t.name)}</td>
            <td class="mono" style="font-size:11.5px">${esc(t.key)}</td>
            <td>${Number(t.remain_quota) > 0
                  ? '¥' + yuan(Number(t.remain_quota) / 1e6)
                  : '<span class="tag neutral">不限</span>'}</td>
            <td>¥${(Number(t.used_quota) / 1e6).toFixed(6)}</td>
            <td class="mono" style="font-size:11.5px">${fmtTime(t.created_at)}</td>
            <td style="text-align:right"><button class="btn btn-sm" data-del="${t.id}">删除</button></td>
          </tr>`).join('')}</tbody>
        </table>`}`;

  $('#tokNew').onclick = () => {
    const name = prompt('给这个密钥起个名字（便于以后区分，比如：本地脚本）', '默认令牌');
    if (name === null) return;
    createToken(name.trim() || '默认令牌');
  };

  pane.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('删除后正在使用这个密钥的程序会立刻失效。确定删除？')) return;
      const res = await api('/api/token/' + btn.dataset.del, {method: 'DELETE'});
      if (!res.success) { toast(res.message || '删除失败'); return; }
      toast('已删除');
      await userTokens(pane);
    };
  });
}

async function createToken(name) {
  const res = await api('/api/token', {method: 'POST', body: JSON.stringify({name})});
  if (!res.success) { toast(res.message || '创建失败'); return; }

  const pane = $('#userPane');
  await userTokens(pane);   // 先重绘列表，顺带准备好 #tokFlash 容器

  // 明文 key 只有这一次机会：库里存的就是明文，但列表接口只返回脱敏值
  $('#tokFlash').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="k">新密钥已生成 · 只显示这一次，请立刻复制保存</div>
      <div class="mono" style="font-size:13px;margin:8px 0;word-break:break-all;line-height:1.7">${esc(res.data.key)}</div>
      <button class="btn btn-sm" id="tokCopy">复制密钥</button>
    </div>`;
  $('#tokCopy').onclick = () => copyText(res.data.key);
}

/* ── 站点品牌：从后端取配置并应用到页面 ──
 *
 * 这套系统要分发给不同用户部署，品牌名/Logo 必须可改。
 * 配置存 options 表，页面加载时拉一次，改完刷新即生效。
 */
let SITE = { name: 'LLM Gateway', desc: '', footer: '', has_logo: false, logo_url: '/favicon.ico' };

async function loadSiteBrand() {
  try {
    const r = await fetch('/api/site', { cache: 'no-store' });
    const j = await r.json();
    if (j && j.data) {
      SITE = Object.assign(SITE, j.data);
      applySiteBrand();
    }
  } catch (e) {
    // 拿不到就保持默认，绝不能因为读配置失败让页面白屏
  }
}

function applySiteBrand() {
  document.title = SITE.name + ' · 控制台';
  document.querySelectorAll('.brand, .sidebrand').forEach(el => {
    const span = el.querySelector('span');
    if (span && !span.classList.contains('logo')) {
      span.textContent = SITE.name;
    }
  });
  // 没有自定义 Logo 时，字母方块取品牌名首字
  const initial = (SITE.name || 'L').trim().charAt(0).toUpperCase();
  document.querySelectorAll('.logo').forEach(el => {
    if (el.dataset.img === '1') return;   // 已是图片，不动
    el.textContent = initial;
  });
  // 登录页标题也一起换
  const lt = document.querySelector('#loginTitle');
  if (lt) lt.textContent = SITE.name;
  const ld = document.querySelector('#loginSub');
  if (ld && SITE.desc) ld.textContent = SITE.desc;

  if (SITE.has_logo) {
    document.querySelectorAll('.logo').forEach(el => {
      if (el.dataset.img === '1') return;
      const img = document.createElement('img');
      img.src = SITE.logo_url;
      img.alt = SITE.name;
      img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block';
      el.dataset.img = '1';
      el.textContent = '';
      el.style.background = 'transparent';
      el.appendChild(img);
    });
    // 浏览器标签页图标也跟着换
    let link = document.querySelector('link[rel="icon"]');
    if (!link) {
      link = document.createElement('link');
      link.rel = 'icon';
      document.head.appendChild(link);
    }
    link.href = SITE.logo_url;
  }
}

async function showModelPicker(pane, userId, username) {
  const [cur, plaza] = await Promise.all([
    api(`/api/manage/accounts/${userId}/models`),
    api('/api/model/plaza'),
  ]);
  const assigned = new Map((cur.data.items||[]).map(i => [i.model, i.price]));
  const all = plaza.data.items || [];

  pane.innerHTML = `
    <div class="pagehead">
      <div><h2>分配模型 · ${esc(username)}</h2>
        <div class="desc">勾选要开放的模型并填单价（元/次），填 0 表示免费</div></div>
      <button class="btn btn-sm" id="back">← 返回</button>
    </div>
    <div class="toolbar">
      <input id="flt" placeholder="筛选模型…" style="max-width:200px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-sm" id="allBtn">全选</button>
        <button class="btn btn-sm" id="noneBtn">全不选</button>
        <button class="btn btn-sm" id="bulkBtn">批量设价</button>
        <span id="cnt" style="font-size:12px;color:var(--muted)"></span>
      </div>
    </div>
    <div id="lst" style="max-height:460px;overflow-y:auto;
         border:1px solid var(--line);border-radius:3px"></div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn btn-sm btn-primary" id="save">保存</button>
      <button class="btn btn-sm" id="cancel">取消</button>
    </div>`;

  const lst = pane.querySelector('#lst');

  function paint() {
    const kw = (pane.querySelector('#flt').value||'').toLowerCase();
    const shown = all.filter(m => !kw || m.model.toLowerCase().includes(kw)
      || m.vendor.toLowerCase().includes(kw));
    lst.innerHTML = shown.map(m => {
      const on = assigned.has(m.model);
      const price = on ? (assigned.get(m.model)/1000000).toFixed(6) : '0.005000';
      return `
        <label style="display:flex;align-items:center;gap:10px;padding:7px 12px;
               border-bottom:1px solid var(--line);cursor:pointer">
          <input type="checkbox" data-m="${esc(m.model)}" ${on?'checked':''}
                 style="width:auto;margin:0;cursor:pointer">
          <span class="mono" style="flex:1;font-size:12px">${esc(m.model)}</span>
          <span style="font-size:11px;color:var(--dim);min-width:72px">${esc(m.vendor)}</span>
          <input type="number" step="0.0001" min="0" data-p="${esc(m.model)}" value="${price}"
                 style="width:86px;padding:2px 6px;font-size:12px" ${on?'':'disabled'}>
          <span style="font-size:11px;color:var(--dim)">元/次</span>
        </label>`;
    }).join('');
    lst.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.onchange = () => {
        const pe = lst.querySelector(`input[data-p="${CSS.escape(cb.dataset.m)}"]`);
        if (pe) pe.disabled = !cb.checked;
      };
    });
    count();
  }

  function count() {
    pane.querySelector('#cnt').textContent =
      `已选 ${lst.querySelectorAll('input[type=checkbox]:checked').length} / ${all.length}`;
  }

  paint();
  pane.querySelector('#flt').oninput = paint;
  pane.querySelector('#back').onclick = () => renderAdmin('accounts');
  pane.querySelector('#cancel').onclick = () => renderAdmin('accounts');
  pane.querySelector('#allBtn').onclick = () => {
    lst.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.checked = true;
      const pe = lst.querySelector(`input[data-p="${CSS.escape(cb.dataset.m)}"]`);
      if (pe) pe.disabled = false;
    });
    count();
  };
  pane.querySelector('#noneBtn').onclick = () => {
    lst.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    lst.querySelectorAll('input[data-p]').forEach(pe => pe.disabled = true);
    count();
  };
  pane.querySelector('#bulkBtn').onclick = () => {
    const v = prompt('统一单价（元/次）', '0.005');
    if (v === null) return;
    const n = parseFloat(v);
    if (isNaN(n) || n < 0) { toast('必须是非负数'); return; }
    lst.querySelectorAll('input[data-p]').forEach(pe => {
      const cb = lst.querySelector(`input[data-m="${CSS.escape(pe.dataset.p)}"]`);
      if (cb && cb.checked) pe.value = n.toFixed(6);
    });
  };
  pane.querySelector('#save').onclick = async () => {
    const items = [];
    lst.querySelectorAll('input[type=checkbox]:checked').forEach(cb => {
      const pe = lst.querySelector(`input[data-p="${CSS.escape(cb.dataset.m)}"]`);
      items.push({model: cb.dataset.m,
        price: Math.round((parseFloat(pe?pe.value:'0')||0)*1000000)});
    });
    const r = await api(`/api/manage/accounts/${userId}/models`, {
      method:'PUT', body:JSON.stringify({items})
    });
    toast(r.success ? `已保存 ${r.data.saved} 个` : (r.message||'失败'));
    if (r.success) renderAdmin('accounts');
  };
}

async function adminBrand(pane) {
  const r = await api('/api/manage/settings');

  pane.innerHTML = `

      <div style="background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
           padding:20px;box-shadow:var(--shadow);max-width:620px">
        <div style="margin-bottom:16px">

          <label>站点描述</label>
          <input id="b_desc" value="${esc(s.desc||'')}" placeholder="一句话说明这个站是做什么的" maxlength="120">
          <div style="font-size:11.5px;color:var(--dim);margin-top:5px">
            显示在登录页副标题</div>
        </div>
        <div style="margin-bottom:18px">
          <label>页脚文字</label>
          <input id="b_footer" value="${esc(s.footer||'')}" placeholder="例如：© 2026 某某科技" maxlength="120">
        </div>
        <button class="btn btn-primary" id="b_save">保存</button>
      </div>
    </div>

    <div class="section">
      <h3>站点 Logo</h3>
      <div style="background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
           padding:20px;box-shadow:var(--shadow);max-width:620px">
        <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
          <div id="b_preview" style="width:72px;height:72px;border-radius:14px;
               background:var(--panel2);border:1px solid var(--line);flex:0 0 72px;
               display:flex;align-items:center;justify-content:center;overflow:hidden">
            ${s.has_logo
              ? `<img src="${esc(s.logo_url||'/favicon.ico')}" style="width:100%;height:100%;object-fit:contain">`
              : `<span style="font-size:11px;color:var(--dim);text-align:center">默认<br>Logo</span>`}
          </div>
          <div style="flex:1;min-width:220px">
            <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">
              支持 PNG / ICO / JPEG / WebP，不超过 512KB。建议正方形，最小 64×64。
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <input type="file" id="b_file" accept="image/png,image/x-icon,image/jpeg,image/webp"
                     style="display:none">
              <button class="btn btn-sm btn-primary" id="b_pick">选择图片</button>
              ${s.is_custom ? '<button class="btn btn-sm btn-danger" id="b_reset">恢复默认</button>' : ''}
              <span id="b_status" style="font-size:12px;color:var(--dim)"></span>
            </div>
            <div style="font-size:11.5px;color:var(--dim);margin-top:8px">
              ${s.is_custom ? '当前使用自定义 Logo（' + (s.logo_size/1024).toFixed(1) + ' KB）' : '当前使用内置默认 Logo'}
            </div>
          </div>
        </div>
      </div>
    </div>`;

  pane.querySelector('#b_save').onclick = async () => {
    const body = {
      name: pane.querySelector('#b_name').value.trim(),
      desc: pane.querySelector('#b_desc').value.trim(),
      footer: pane.querySelector('#b_footer').value.trim(),
    };
    if (!body.name) { toast('站点名称不能为空'); return; }
    const r2 = await api('/api/manage/settings', { method: 'PUT', body: JSON.stringify(body) });
    toast(r2.success ? '已保存，刷新页面生效' : (r2.message || '保存失败'));
    if (r2.success) {
      SITE = Object.assign(SITE, body);
      applySiteBrand();

  const fileEl = pane.querySelector('#b_file');

  pane.querySelector('#b_pick').onclick = () => fileEl.click();

      const r2 = await api('/api/manage/settings/logo', {

    reader.onerror = () => { statusEl.textContent = ''; toast('读取文件失败'); };
    reader.readAsDataURL(f);
  };

  const resetBtn = pane.querySelector('#b_reset');
  if (resetBtn) {

      toast(r2.success ? '已恢复默认' : (r2.message || '操作失败'));
      if (r2.success) renderAdmin('brand');
    };
  }
}

function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(() => toast('已复制：'+t));
  } else {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制：'+t); }
    catch(e) { prompt('复制：', t); }
    ta.remove();
  }
}
